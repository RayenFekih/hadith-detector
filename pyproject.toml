[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "hadith-detector"
dynamic = ["version"]
description = "Deterministic offline Arabic textual matching against Sahih Bukhari and Sahih Muslim"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mohamed Rayen Fekih"}]
dependencies = ["rapidfuzz>=3.14.6,<4", "marisa-trie==1.4.1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/RayenFekih/hadith-detector"
Issues = "https://github.com/RayenFekih/hadith-detector/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16.6", "mypy>=1.15", "build>=1.2", "twine>=6"]
data = ["huggingface-hub>=1", "pyarrow>=20"]
benchmark = ["psutil>=7", "rapidfuzz==3.14.6"]
review = ["ipywidgets>=8,<9", "jupyterlab>=4,<5", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hadith_detector*"]
namespaces = false

[tool.setuptools.package-data]
hadith_detector = ["py.typed", "_bundle.json", "_data/*", "_data/notices/*"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks", "others", "data", "tools/bundle-notices"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["hadith_detector"]

[tool.mypy]
exclude = ["^src/hadith_detector/_data/"]
python_version = "3.11"
strict = true
files = ["src/hadith_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
markers = [
    "packaging: build and clean-install checks (requires build dependencies)",
    "data: synthetic preprocessing tests (requires the data dependency group)",
    "benchmark: isolated synthetic benchmark smoke test (requires psutil)",
]
