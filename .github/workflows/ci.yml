name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    name: Synthetic index benchmark smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked --group benchmark
      - run: uv run --frozen --group benchmark pytest tests/test_exact_benchmark.py

  data:
    name: Synthetic data pipeline (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked --group data
      - run: uv run --frozen --group data pytest -m data

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --frozen pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src/hadith_detector
      - run: uv build --no-sources
      - run: uv run --frozen twine check dist/*
