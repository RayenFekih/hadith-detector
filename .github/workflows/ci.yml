name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rapidfuzz:
    name: Fuzzy backend compatibility (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --group benchmark
      - run: uv run --frozen --group benchmark python -m pytest tests/test_fuzzy_benchmark.py -m "not benchmark"
  benchmark:
    name: Synthetic index benchmark smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked --group benchmark
      - run: uv run --frozen --group benchmark python -m pytest tests/test_exact_benchmark.py tests/test_fuzzy_benchmark.py

  data:
    name: Synthetic data pipeline (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked --group data
      - run: uv run --frozen --group data python -m pytest -m data

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --frozen python -m pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src/hadith_detector
      # Tests build isolated synthetic bundles. Full production builds belong to
      # the manually triggered, non-publishing release-readiness workflow.
