target-version = "py314"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[lint.isort]
known-first-party = ["src"]

[lint.per-file-ignores]
"*.ipynb" = ["F401"]  # Research notebooks may keep exploratory imports.
